<svg width="820" height="200" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>VibeCheck logo</title>
<desc>A speech bubble icon with a smiling face, next to the wordmark VibeCheck in large text, where "Check" is in purple</desc>
<defs>
<linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#a855f7"/>
<stop offset="100%" stop-color="#7c3aed"/>
</linearGradient>
</defs>

<g transform="translate(30,20)">
<path d="M10,10 h140 a20,20 0 0 1 20,20 v90 a20,20 0 0 1 -20,20 h-90 l-30,30 v-30 h-20 a20,20 0 0 1 -20,-20 v-90 a20,20 0 0 1 20,-20 z" fill="url(#bubbleGrad)"/>
<circle cx="55" cy="75" r="7" fill="#ffffff"/>
<circle cx="125" cy="75" r="7" fill="#ffffff"/>
<path d="M50,105 q40,35 80,0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</g>

<text x="260" y="145" font-family="Arial, sans-serif" font-size="90" font-weight="600" fill="#ffffff">Vibe<tspan fill="#c084fc">Check</tspan></text>
</svg>
